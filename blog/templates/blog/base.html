{% load static %}
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TheBlog</title>
	<link rel="icon" href="{% static 'blog/favicon.png' %}" type="image/x-icon">
	<link rel="stylesheet" href="{% static 'blog/style.css' %}">
	<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
	<header class="site-header">
		<div class="container header-inner">
			<h1 class="site-title"><a href="{% url 'post-list' %}">TheBlog</a></h1>
			<nav aria-label="Primary navigation">
				<ul class="nav-list">
					<li><a href="{% url 'post-list' %}">Home</a></li>
					{% if user.is_authenticated %}
						<li class="nav-user">Hello, {{ user.username }}</li>
						<li><a href="{% url 'post-create' %}">Create Post</a></li>
						<li>
							<form method="post" action="{% url 'accounts:logout' %}" class="logout-form">
								{% csrf_token %}
								<button type="submit" class="logout-button">Logout</button>
							</form>
						</li>
					{% else %}
						<li><a href="{% url 'accounts:login' %}">Login</a></li>
						<li><a href="{% url 'accounts:register' %}">Register</a></li>
					{% endif %}
				</ul>
			</nav>
		</div>
	</header>

	<main class="container">
		{% block content %}{% endblock %}
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>TheBlog interface improvements</p>
		</div>
	</footer>
</body>
</html>
