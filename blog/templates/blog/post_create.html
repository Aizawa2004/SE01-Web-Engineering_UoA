{% extends 'blog/base.html' %}

{% block content %}
<section aria-labelledby="create-post-heading">
	<h2 id="create-post-heading">Create Post</h2>
	<form method="post" class="form-card">
		{% csrf_token %}
		{{ form.non_field_errors }}
		<div class="form-row">
			<label for="{{ form.title.id_for_label }}">Title</label>
			{{ form.title }}
			{{ form.title.errors }}
		</div>
		<div class="form-row">
			<label for="{{ form.body.id_for_label }}">Body</label>
			{{ form.body }}
			{{ form.body.errors }}
		</div>
		<button type="submit">Save</button>
	</form>
</section>
{% endblock %}
