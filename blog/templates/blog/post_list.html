{% extends 'blog/base.html' %}

{% block content %}
<div class="layout-shell">
	<aside class="filter-panel" aria-labelledby="filter-heading">
		<h2 id="filter-heading">Filters</h2>
		<form
			method="get"
			action="{% url 'post-list' %}"
			class="filter-form form-card"
			hx-get="{% url 'post-list' %}"
			hx-target="#post-list-container"
			hx-trigger="change from:select, change from:input[type=date], keyup changed delay:500ms from:input[name='q']"
			hx-include="[name='q'], [name='author'], [name='date']"
			hx-push-url="true"
		>
			<div class="form-row">
				<label for="author-filter">Author</label>
				<select id="author-filter" name="author">
					<option value="">All authors</option>
					{% for author in authors %}
						<option value="{{ author.username }}" {% if selected_author == author.username %}selected{% endif %}>{{ author.username }}</option>
					{% endfor %}
				</select>
			</div>
			<div class="form-row">
				<label for="date-filter">Date</label>
				<input id="date-filter" type="date" name="date" value="{{ selected_date }}">
			</div>
			<div class="form-row">
				<label for="search-filter">Search title</label>
				<input id="search-filter" type="search" name="q" value="{{ search_query }}" placeholder="Search titles">
			</div>
			<button type="submit">Apply filters</button>
		</form>

		<section aria-labelledby="authors-heading" class="author-panel">
			<h3 id="authors-heading">Authors</h3>
			<ul class="author-list">
				{% for author in authors %}
					<li>
						<a
							href="?author={{ author.username }}"
							hx-get="?author={{ author.username }}"
							hx-target="#post-list-container"
							hx-push-url="true"
						>{{ author.username }}</a>
					</li>
				{% empty %}
					<li>No authors yet.</li>
				{% endfor %}
			</ul>
		</section>
	</aside>

	<section aria-labelledby="posts-heading" class="posts-panel">
		<h2 id="posts-heading">{{ page_title }}</h2>
		<div id="post-list-container">
			{% include 'blog/partials/post_list_content.html' %}
		</div>
	</section>
</div>
{% endblock %}
